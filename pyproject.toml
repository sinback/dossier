[project]
name = "dossier-analysis"
version = "0.1.0"
description = "Analysis and font-processing tools for Dossier handwriting and glyph systems"
requires-python = ">=3.9"
dependencies = [
    "pillow>=11.3.0",
    "scipy",
    "fonttools",
    "ufo2ft",
    "defcon"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
